<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog Primeo — Actualités, conseils et analyses sur la réservation d'hébergement, l'immobilier et la restauration en Côte d'Ivoire.">
  <meta name="robots" content="index, follow">
  <meta name="api-url" content="https://primeo-api-sszr.onrender.com">
  <title>Blog — Primeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/blog.css">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Primeo">
  <meta property="og:url" content="https://primeo.ci/blog/">
  <meta property="og:title" content="Blog — Primeo">
  <meta property="og:description" content="Blog Primeo — Actualités, conseils et analyses sur la réservation d'hébergement, l'immobilier et la restauration en Côte d'Ivoire.">
  <meta property="og:image" content="https://primeo.ci/assets/img/og/og-blog.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog — Primeo">
  <meta name="twitter:description" content="Blog Primeo — Actualités, conseils et analyses sur la réservation d'hébergement, l'immobilier et la restauration en Côte d'Ivoire.">
  <meta name="twitter:image" content="https://primeo.ci/assets/img/og/og-blog.png">
  <link rel="canonical" href="https://primeo.ci/blog/">
  <!-- JSON-LD -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Blog","url":"https://primeo.ci/blog/","name":"Blog Primeo","description":"Actualités, conseils et analyses sur la réservation d'hébergement, l'immobilier et la restauration en Côte d'Ivoire.","publisher":{"@id":"https://primeo.ci/#organization"},"isPartOf":{"@id":"https://primeo.ci/#website"}}
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <!-- Hero -->
    <section class="blog-hero">
      <div class="container">
        <h1>Le Blog Primeo</h1>
        <p>Actualités, conseils et analyses sur l'hébergement, l'immobilier et la restauration en Côte d'Ivoire</p>
      </div>
    </section>

    <!-- Filters -->
    <section class="blog-filters-bar">
      <div class="container">
        <div class="blog-filters-inner">
          <div class="blog-search-wrap">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M13 13L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="search" id="blog-search" placeholder="Rechercher un article…" aria-label="Rechercher">
          </div>
          <div class="blog-cats" id="blog-cats">
            <button class="cat-btn active" data-slug="">Tous</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Posts grid -->
    <section class="section blog-posts-section">
      <div class="container">
        <div class="blog-grid" id="blog-grid">
          <!-- skeleton -->
          <div class="blog-card skeleton"></div>
          <div class="blog-card skeleton"></div>
          <div class="blog-card skeleton"></div>
        </div>
        <p class="blog-empty" id="blog-empty" hidden>Aucun article trouvé.</p>
        <!-- Pagination -->
        <div class="blog-pagination" id="blog-pagination" hidden>
          <button class="btn btn-outline" id="btn-prev" aria-label="Page précédente">← Précédent</button>
          <span id="page-info"></span>
          <button class="btn btn-outline" id="btn-next" aria-label="Page suivante">Suivant →</button>
        </div>
      </div>
    </section>

    <!-- Newsletter -->
    <section class="blog-newsletter-section">
      <div class="container">
        <div class="blog-newsletter-box">
          <div class="newsletter-text">
            <h2>Restez informé</h2>
            <p>Recevez nos derniers articles et conseils directement dans votre boîte mail.</p>
          </div>
          <form class="newsletter-form" id="newsletter-form" novalidate>
            <div class="newsletter-input-wrap">
              <input type="email" id="newsletter-email" placeholder="votre@email.com" autocomplete="email" required>
              <button type="submit" class="btn btn-primary" id="newsletter-btn">
                <span class="btn-text">S'abonner</span>
                <span class="btn-spinner" hidden></span>
              </button>
            </div>
            <p class="newsletter-msg" id="newsletter-msg" hidden></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/js/main.js" data-base=".."></script>
  <script src="../assets/js/blog.js" data-page="listing"></script>
</body>
</html>
