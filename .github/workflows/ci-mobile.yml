name: CI — Mobile

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · TypeCheck · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm par package, install propre (comme sur Netlify).
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Gate dur : les types doivent passer.
      - name: TypeScript check
        run: npx tsc --noEmit

      # Gate dur : aucune erreur de lint (avertissements tolérés).
      - name: Lint
        run: npm run lint

      # Gate dur : tests de logique + seuils de couverture (coverageThreshold).
      - name: Tests + couverture
        run: npm test

      # Gate dur : tests de composants (React Native Testing Library).
      - name: Tests de composants (RNTL)
        run: npm run test:components
