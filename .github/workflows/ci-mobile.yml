name: CI — Mobile

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · TypeCheck · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm par package, install propre (comme sur Netlify).
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Gate dur : les types doivent passer.
      - name: TypeScript check
        run: npx tsc --noEmit

      # Gate dur : aucune erreur de lint (avertissements tolérés).
      - name: Lint
        run: npm run lint

      # Gate dur : tests de logique + seuils de couverture (coverageThreshold).
      - name: Tests + couverture
        run: npm test

      # Gate dur : tests de composants (React Native Testing Library).
      - name: Tests de composants (RNTL)
        run: npm run test:components

  # ── E2E Detox — NON bloquant (continue-on-error) ─────────────────────────────
  # Parcours complet client (inscription → recherche → réservation 10 % →
  # confirmation) sur émulateur Android. Lourd (prebuild + build natif + AVD) :
  # toléré en échec pour l'instant (cf. docs/E2E-DETOX.md).
  e2e-detox-android:
    name: E2E Detox (Android, non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Expo prebuild (Android)
        run: npm run e2e:prebuild
      - name: Enable KVM (accélération émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Detox build + test (émulateur)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: mobile
          script: |
            npm run e2e:build:android
            npm run e2e:test:android --headless
