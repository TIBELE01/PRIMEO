name: CI — Backend

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'backend/**'
      - 'k6/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'k6/**'

# Annule les exécutions précédentes encore en cours sur la même réf
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · Lint · TypeCheck · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm par package, install propre (pas de lockfile — comme sur Render).
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      # Gate dur : le code TypeScript doit compiler (artefact déployable).
      - name: TypeScript build
        run: npm run build

      # Gate dur : aucune erreur de lint (les avertissements restent tolérés).
      - name: Lint
        run: npm run lint

      # Gate dur : tests + seuils de couverture (jest échoue si la couverture
      # passe sous coverageThreshold — voir jest.config.js).
      - name: Tests + couverture
        run: npm run test:coverage

  # Test de charge k6 — non bloquant, déclenché via load-test.yml après déploiement staging.
  # Voir .github/workflows/load-test.yml pour l'exécution complète (50 rps, p95 < 500 ms).
  load-test-hint:
    name: Load test (k6) — déclenché séparément
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Rappel
        run: |
          echo "Le test de charge k6 (50 rps, p95 < 500 ms) s'exécute via le workflow"
          echo "'Load Test — Recherche (k6)' après déploiement en staging."
          echo "Déclencher manuellement : Actions → Load Test → Run workflow."
