name: CI — Backend

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

# Annule les exécutions précédentes encore en cours sur la même réf
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · Lint · TypeCheck · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm par package, install propre (pas de lockfile — comme sur Render).
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      # Gate dur : le code TypeScript doit compiler (artefact déployable).
      - name: TypeScript build
        run: npm run build

      # Gate dur : aucune erreur de lint (les avertissements restent tolérés).
      - name: Lint
        run: npm run lint

      # Gate dur : tests + seuils de couverture (jest échoue si la couverture
      # passe sous coverageThreshold — voir jest.config.js).
      - name: Tests + couverture
        run: npm run test:coverage
