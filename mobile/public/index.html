<!DOCTYPE html>
<!--
  Modèle HTML de l'application web Primeo (export Expo / react-native-web).
  - lang="fr" : le contenu est en français. Avec lang="en", Chrome proposait (ou appliquait)
    la traduction automatique ; le traducteur réécrit les textes dans le DOM et React plante
    ensuite au changement d'écran (« Failed to execute 'removeChild' on 'Node' »).
  - translate="no" + meta google notranslate : désactive la traduction automatique de la page.
-->
<html lang="fr" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>Primeo – Application de réservation en Côte d'Ivoire</title>
    <!-- Application privée (espaces clients et professionnels) : exclue des moteurs de recherche.
         Les pages publiques à référencer sont sur primeo.ci. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Application Primeo : réservez résidences, hôtels, restaurants et biens immobiliers en Côte d'Ivoire, payez en Mobile Money et suivez vos réservations." />
    <meta name="theme-color" content="#0055FF" />
    <!-- Aperçu des liens partagés (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Primeo" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Primeo – Application de réservation en Côte d'Ivoire" />
    <meta property="og:description" content="Réservez résidences, hôtels, restaurants et biens immobiliers en Côte d'Ivoire, payez en Mobile Money et suivez vos réservations." />
    <meta property="og:image" content="https://primeo.ci/assets/img/og/og-telechargement.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://primeo.ci/assets/img/og/og-telechargement.png" />
    <script>
      // Garde-fou DOM (contournement documenté par React, issue #11538) : une extension du
      // navigateur ou un traducteur peut déplacer/envelopper des nœuds gérés par React. Au
      // lieu de faire planter toute l'application, on retire le nœud de son parent réel /
      // on l'insère en fin de conteneur.
      (function () {
        if (typeof Node !== 'function' || !Node.prototype) return;
        var removeChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (child.parentNode) return removeChild.call(child.parentNode, child);
            return child;
          }
          return removeChild.apply(this, arguments);
        };
        var insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return this.appendChild(newNode);
          }
          return insertBefore.apply(this, arguments);
        };
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Activez JavaScript pour utiliser l'application Primeo.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root" translate="no"></div>
  </body>
</html>
