services:
  postgres:
    image: postgres:16-alpine
    container_name: primeo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primeo
      POSTGRES_PASSWORD: primeo_dev
      POSTGRES_DB: primeo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U primeo -d primeo_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: primeo_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
