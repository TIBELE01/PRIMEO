# docker-compose.prod.yml
# Usage : docker compose -f docker-compose.prod.yml up -d
# NOTE : En production, la base de données est hébergée sur Supabase.
# Ce fichier est réservé à un éventuel déploiement auto-hébergé.

services:
  postgres:
    image: postgres:16-alpine
    container_name: primeo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_prod_data:
    driver: local
